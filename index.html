<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OIML → SMART — Spinning Globe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root { --dk: #61b4ff; --lt: #004996; }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            font-family: 'JetBrains Mono', monospace;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        main { display: flex; flex-direction: column; min-height: 100vh; }

        .row {
            display: flex;
            flex: 1;
        }

        .panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            min-height: 50vh;
            position: relative;
            padding: 2.5rem 2rem;
            overflow: hidden;
        }

        .panel.dark {
            background:
                radial-gradient(ellipse 70% 55% at 28% 35%, rgba(18,40,85,0.2) 0%, transparent 100%),
                radial-gradient(ellipse 45% 35% at 72% 65%, rgba(97,180,255,0.05) 0%, transparent 100%),
                radial-gradient(ellipse at 50% 50%, #0a1020 0%, #050810 100%);
        }

        .panel.dark::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(1px 1px at 7% 14%, rgba(255,255,255,0.3), transparent),
                radial-gradient(1px 1px at 23% 42%, rgba(255,255,255,0.15), transparent),
                radial-gradient(1px 1px at 48% 6%, rgba(255,255,255,0.22), transparent),
                radial-gradient(1px 1px at 69% 74%, rgba(255,255,255,0.18), transparent),
                radial-gradient(1px 1px at 88% 28%, rgba(255,255,255,0.12), transparent),
                radial-gradient(1.5px 1.5px at 42% 22%, rgba(200,220,255,0.2), transparent),
                radial-gradient(1px 1px at 55% 92%, rgba(255,255,255,0.12), transparent),
                radial-gradient(1px 1px at 91% 85%, rgba(255,255,255,0.14), transparent);
            pointer-events: none;
        }

        .panel.light {
            background:
                radial-gradient(ellipse 70% 50% at 50% 50%, rgba(0,73,150,0.025) 0%, transparent 100%),
                radial-gradient(ellipse at 50% 40%, #faf8f4 0%, #f5f3ed 100%);
        }

        .globe-wrap {
            position: relative;
            width: min(42vmin, 320px);
            transition: transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .globe-wrap:hover { transform: scale(1.03); }

        .globe-wrap svg {
            display: block;
            width: 100%;
            height: auto;
            position: relative;
            z-index: 1;
        }

        .glow {
            position: absolute;
            top: 47%;
            left: 50%;
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }

        .g1 { width: 85%; aspect-ratio: 1; transform: translate(-50%, -50%); }
        .g2 { width: 50%; aspect-ratio: 1; transform: translate(-50%, -50%); }

        .panel.dark .g1 {
            background: radial-gradient(circle, rgba(97,180,255,0.12) 0%, transparent 70%);
            filter: blur(50px);
            animation: breathe 7s ease-in-out infinite;
        }
        .panel.dark .g2 {
            background: radial-gradient(circle, rgba(97,180,255,0.1) 0%, transparent 60%);
            filter: blur(25px);
            animation: breathe 7s ease-in-out infinite 1.5s;
        }
        .panel.light .g1 {
            background: radial-gradient(circle, rgba(0,73,150,0.05) 0%, transparent 70%);
            filter: blur(55px);
        }
        .panel.light .g2 {
            background: radial-gradient(circle, rgba(0,73,150,0.04) 0%, transparent 55%);
            filter: blur(25px);
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
            50%       { opacity: 1;   transform: translate(-50%, -50%) scale(1.15); }
        }

        .label {
            position: relative;
            z-index: 1;
            margin-top: 1.2rem;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-weight: 300;
            font-size: 1rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
        }
        .panel.dark .label { color: rgba(97,180,255,0.35); }
        .panel.light .label { color: rgba(0,73,150,0.3); }

        .sep-v {
            width: 1px;
            background: linear-gradient(to bottom, transparent 5%, rgba(97,180,255,0.1) 50%, transparent 95%);
        }

        .sep-h {
            width: 100%;
            height: 1px;
            background: linear-gradient(to right, transparent 5%, rgba(97,180,255,0.1) 50%, transparent 95%);
        }

        .mode-nav {
            position: fixed;
            top: 1rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 0.5rem;
            z-index: 100;
            flex-wrap: wrap;
            justify-content: center;
        }

        .mode-nav button {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 0.5rem 1rem;
            border: 1px solid rgba(97,180,255,0.3);
            background: rgba(10,16,32,0.8);
            color: rgba(97,180,255,0.6);
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .mode-nav button:hover {
            border-color: rgba(97,180,255,0.6);
            color: rgba(97,180,255,0.9);
        }

        .mode-nav button.active {
            background: rgba(97,180,255,0.15);
            border-color: rgba(97,180,255,0.5);
            color: #61b4ff;
        }

        .progress-bar {
            position: fixed;
            top: 4rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: none;
            align-items: center;
            gap: 0.75rem;
            background: rgba(10,16,32,0.85);
            padding: 0.5rem 1rem;
            border: 1px solid rgba(97,180,255,0.2);
            border-radius: 4px;
        }

        .progress-bar label {
            font-size: 0.65rem;
            color: rgba(97,180,255,0.5);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .progress-bar input[type="range"] {
            width: 180px;
            accent-color: #61b4ff;
        }

        .progress-bar span {
            font-size: 0.7rem;
            color: rgba(97,180,255,0.7);
            min-width: 2.5rem;
            text-align: right;
        }

        @media (prefers-reduced-motion: reduce) {
            .g1, .g2 { animation: none; }
        }

        @media (max-width: 768px) {
            .row { flex-direction: column; }
            .panel { padding: 2rem 1rem; }
            .globe-wrap { width: min(70vmin, 320px); }
            .label { font-size: 0.9rem; }
            .mode-nav button { padding: 0.4rem 0.7rem; font-size: 0.6rem; }
            .sep-v { display: none; }
        }
    </style>
</head>
<body>
    <nav class="mode-nav">
        <button data-mode="forward" class="active">OIML → SMART</button>
        <button data-mode="reverse">SMART → OIML</button>
        <button data-mode="spinner">Spinner</button>
        <button data-mode="progress">Progress</button>
    </nav>

    <div class="progress-bar" id="progress-bar">
        <label for="pct-slider">Fill</label>
        <input type="range" id="pct-slider" min="0" max="100" value="0">
        <span id="pct-label">0%</span>
    </div>

    <main>
        <div class="row">
            <section class="panel dark">
                <div class="globe-wrap">
                    <div class="glow g1"></div>
                    <div class="glow g2"></div>
                    <div id="globe-dark"></div>
                </div>
                <p class="label">Wireframe</p>
            </section>
            <div class="sep-v"></div>
            <section class="panel dark">
                <div class="globe-wrap">
                    <div class="glow g1"></div>
                    <div class="glow g2"></div>
                    <div id="globe-3d-dark"></div>
                </div>
                <p class="label">3D Filled</p>
            </section>
        </div>

        <div class="sep-h"></div>

        <div class="row">
            <section class="panel light">
                <div class="globe-wrap">
                    <div class="glow g1"></div>
                    <div class="glow g2"></div>
                    <div id="globe-light"></div>
                </div>
                <p class="label">Wireframe</p>
            </section>
            <div class="sep-v"></div>
            <section class="panel light">
                <div class="globe-wrap">
                    <div class="glow g1"></div>
                    <div class="glow g2"></div>
                    <div id="globe-3d-light"></div>
                </div>
                <p class="label">3D Filled</p>
            </section>
        </div>
    </main>

    <script src="spinning-globe.js"></script>
    <script src="spinning-globe-3d.js"></script>
    <script>
        var dkGlobe = new SpinningGlobe('#globe-dark', {
            theme: 'dark', mode: 'forward', duration: 5.6, spinSpeed: 3.3
        });
        var ltGlobe = new SpinningGlobe('#globe-light', {
            theme: 'light', mode: 'forward', duration: 5.6, spinSpeed: 3.3, delay: 3500
        });

        var dk3d = new SpinningGlobe3D('#globe-3d-dark', {
            theme: 'dark', mode: 'forward', duration: 5.6, spinSpeed: 3.3, fillTime: 4.0
        });
        var lt3d = new SpinningGlobe3D('#globe-3d-light', {
            theme: 'light', mode: 'forward', duration: 5.6, spinSpeed: 3.3, delay: 3500, fillTime: 4.0
        });

        var all = [dkGlobe, ltGlobe, dk3d, lt3d];
        var all3d = [dk3d, lt3d];
        var progressBar = document.getElementById('progress-bar');
        var pctSlider = document.getElementById('pct-slider');
        var pctLabel = document.getElementById('pct-label');

        var btns = document.querySelectorAll('.mode-nav button');
        for (var i = 0; i < btns.length; i++) {
            btns[i].addEventListener('click', function() {
                var m = this.getAttribute('data-mode');
                for (var j = 0; j < all.length; j++) all[j].setMode(m);
                for (var j = 0; j < btns.length; j++) {
                    btns[j].classList.toggle('active', btns[j].getAttribute('data-mode') === m);
                }
                progressBar.style.display = m === 'progress' ? 'flex' : 'none';
                if (m === 'progress') {
                    var pct = parseFloat(pctSlider.value) / 100;
                    for (var j = 0; j < all3d.length; j++) all3d[j].setProgress(pct);
                }
            });
        }

        pctSlider.addEventListener('input', function() {
            var pct = parseFloat(this.value) / 100;
            pctLabel.textContent = Math.round(pct * 100) + '%';
            for (var j = 0; j < all3d.length; j++) all3d[j].setProgress(pct);
        });
    </script>
</body>
</html>
